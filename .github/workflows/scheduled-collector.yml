# DealLens scheduled collector: one budgeted Shopping call per IST slot (09:00, 15:00, 21:00 IST).
# All collection logic lives in the CLI (deallens.collector); this file only schedules it.
# Raw evidence is kept OUT of git and out of artifacts: it is chained between runs with the Actions cache.
name: DealLens scheduled collector

on:
  schedule:
    - cron: "30 3 * * *"    # 03:30 UTC = 09:00 IST
    - cron: "30 9 * * *"    # 09:30 UTC = 15:00 IST
    - cron: "30 15 * * *"   # 15:30 UTC = 21:00 IST

concurrency:
  group: deallens-scheduled-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DealLens
        run: python -m pip install .

      - name: Restore evidence from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: |
            data/evidence
            data/private
          key: deallens-evidence-${{ github.run_id }}
          restore-keys: deallens-evidence-

      - name: Resolve the explicit IST slot
        id: slot
        run: echo "target=$(python -m deallens.cli --root . slot --cron '${{ github.event.schedule }}')" >> "$GITHUB_OUTPUT"

      - name: Collect (one paid Shopping call per slot)
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DEALLENS_MODE: live
        run: python -m deallens.cli --root . collect --trigger scheduled --target-time "${{ steps.slot.outputs.target }}"

      - name: Rebuild the disposable projection
        if: always()
        run: python -m deallens.cli --root . rebuild

      - name: Save evidence for later runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/evidence
            data/private
          key: deallens-evidence-${{ github.run_id }}

      # Artifacts are downloadable by anyone in a public repo: publish only run manifests and the projection.
      # Raw responses (they contain SerpApi account/archive URLs) stay in the Actions cache chain above.
      - name: Keep this run's manifests and projection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deallens-evidence-${{ github.run_id }}
          path: |
            data/evidence/manifests
            data/projection
          retention-days: 30
          if-no-files-found: warn
